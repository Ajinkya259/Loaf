<!doctype html>
<meta charset="utf-8">
<title>Deskitty — live rig</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; background:#23232b; color:#e8e8ee; overflow:hidden;
         font:13px/1.5 ui-sans-serif,-apple-system,"SF Pro Text",system-ui,sans-serif; }
  canvas { display:block; }
  #ui { position:fixed; top:14px; left:14px; width:250px; padding:14px 16px;
        background:rgba(20,20,26,.86); border:1px solid #3a3a46; border-radius:10px;
        backdrop-filter:blur(8px); }
  h1 { margin:0 0 2px; font-size:14px; letter-spacing:.01em; }
  .sub { margin:0 0 12px; color:#8e8e9e; font-size:11.5px; }
  label { display:block; margin:11px 0 3px; color:#b8b8c6; font-size:11.5px;
          display:flex; justify-content:space-between; }
  label b { color:#e8e8ee; font-weight:600; font-variant-numeric:tabular-nums; }
  input[type=range] { width:100%; accent-color:#6aa9d8; }
  .row { display:flex; gap:6px; margin-top:12px; flex-wrap:wrap; }
  button { flex:1 1 auto; padding:6px 8px; font:inherit; font-size:11.5px;
           background:#32323d; color:#e8e8ee; border:1px solid #46465400;
           border-radius:6px; cursor:pointer; }
  button:hover { background:#3d3d4a; }
  button[aria-pressed=true] { background:#6aa9d8; color:#16161c; font-weight:600; }
  .note { margin-top:13px; padding-top:11px; border-top:1px solid #35353f;
          color:#8e8e9e; font-size:11px; }
</style>

<div id="ui">
  <h1>Deskitty — live rig</h1>
  <p class="sub">Same armature as the sprite build, posed in the browser.</p>

  <label>walk speed <b id="vSpeed">1.0×</b></label>
  <input type="range" id="speed" min="0" max="3" step="0.05" value="1">

  <label>task load → fatness <b id="vFat">0%</b></label>
  <input type="range" id="fat" min="0" max="1" step="0.01" value="0">

  <label>system stress → hunch <b id="vStress">0%</b></label>
  <input type="range" id="stress" min="0" max="1" step="0.01" value="0">

  <div class="row">
    <button id="bSide" aria-pressed="true">side</button>
    <button id="bFront" aria-pressed="false">front</button>
    <button id="bFree" aria-pressed="false">orbit</button>
  </div>

  <p class="note">Drag to orbit, scroll to zoom. Fatness and stress are continuous
  here — with sprites they can only ever be the handful of levels you pre-rendered.</p>
</div>

<script type="importmap">
{ "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/loaders/GLTFLoader.js": "./vendor/jsm/loaders/GLTFLoader.js",
    "three/addons/controls/OrbitControls.js": "./vendor/jsm/controls/OrbitControls.js",
    "three/addons/utils/BufferGeometryUtils.js": "./vendor/jsm/utils/BufferGeometryUtils.js"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color('#23232b');

const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.1, 100);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.75, 0);
controls.enableDamping = true;

// Lighting roughly mirrors the Blender three-point rig, kept dim for the same reason:
// off-white fur blows out fast and takes the block-to-block shading with it.
scene.add(new THREE.HemisphereLight('#cfd8ea', '#2a2a33', 1.05));
const key = new THREE.DirectionalLight('#ffffff', 1.5);
key.position.set(-4, 5, 5); scene.add(key);
const rim = new THREE.DirectionalLight('#fff4e0', 0.8);
rim.position.set(3, 4, -4); scene.add(rim);

const grid = new THREE.GridHelper(8, 16, '#3d3d4a', '#30303a');
scene.add(grid);

// ---------------------------------------------------------------------------
// The whole point: the walk is NOT baked. These are the same sine curves that
// build_cat.py uses to pose the rig before each sprite render, re-evaluated every
// frame instead of once per exported PNG. Adding a state here costs no re-render.
const SWING = THREE.MathUtils.degToRad(24);
const SWAY  = THREE.MathUtils.degToRad(9);
const DIP   = THREE.MathUtils.degToRad(3);

const B = {};          // bone lookup by name
let root = null, clock = new THREE.Clock(), phase = 0;

const ui = {
  speed: document.getElementById('speed'),
  fat: document.getElementById('fat'),
  stress: document.getElementById('stress'),
};

new GLTFLoader().load('./cat.glb', (gltf) => {
  root = gltf.scene;
  root.traverse((o) => {
    if (o.isBone) B[o.name] = o;
    if (o.isMesh) { o.castShadow = true; o.material.flatShading = true; }
    // the cheek eye decals are for the profile sprite; edge-on they are slivers
    if (/^EyeSide/.test(o.name)) o.visible = false;
  });
  Object.values(B).forEach((b) => b.userData.rest = b.rotation.clone());
  scene.add(root);
  setView('side');
});

function pose(dt) {
  if (!root) return;
  const speed = +ui.speed.value;
  phase += dt * speed * 3.2;

  const swing = Math.sin(phase) * SWING * (speed > 0.02 ? 1 : 0);
  const set = (n, x) => { const b = B[n]; if (b) b.rotation.x = b.userData.rest.x + x; };

  set('legFL',  swing); set('legBR',  swing);
  set('legFR', -swing); set('legBL', -swing);
  set('tailBase', Math.sin(phase + Math.PI / 2) * SWAY);
  set('tailMid',  Math.sin(phase + Math.PI / 3) * SWAY);
  set('tailTip',  Math.sin(phase + Math.PI / 6) * SWAY * 1.4);
  set('head', Math.sin(phase * 2) * DIP);

  // Fatness: continuous here. Sprites can only ever offer the discrete levels you
  // pre-rendered, and Idea.md wants this to track task load smoothly.
  const fat = +ui.fat.value;
  const spine = B['spine'];
  if (spine) spine.scale.set(1 + fat * 0.42, 1, 1 + fat * 0.30);

  // Stress: hunch the back, drop the head, tuck the tail.
  const st = +ui.stress.value;
  if (spine) spine.rotation.z = spine.userData.rest.z - st * 0.16;
  const hd = B['head'];
  if (hd) hd.rotation.x += st * 0.22;
  const tb = B['tailBase'];
  if (tb) tb.rotation.x -= st * 0.55;
}

function setView(v) {
  const d = 4.2;
  if (v === 'side')  camera.position.set(-d, 1.15, 0);
  if (v === 'front') camera.position.set(0, 1.15, -d);
  if (v === 'free')  camera.position.set(-d * 0.75, 2.0, -d * 0.75);
  controls.target.set(0, 0.75, 0);
  for (const [id, name] of [['bSide','side'],['bFront','front'],['bFree','free']])
    document.getElementById(id).setAttribute('aria-pressed', String(name === v));
  // profile shows the cheek decals, front shows the face decals
  if (root) root.traverse((o) => {
    if (/^EyeSide/.test(o.name)) o.visible = (v !== 'front');
    if (/^(EyeL|EyeR|InEar)/.test(o.name)) o.visible = (v === 'front');
  });
}
for (const [id, name] of [['bSide','side'],['bFront','front'],['bFree','free']])
  document.getElementById(id).onclick = () => setView(name);

const fmt = () => {
  document.getElementById('vSpeed').textContent = (+ui.speed.value).toFixed(2) + '×';
  document.getElementById('vFat').textContent = Math.round(ui.fat.value * 100) + '%';
  document.getElementById('vStress').textContent = Math.round(ui.stress.value * 100) + '%';
};
Object.values(ui).forEach((el) => el.addEventListener('input', fmt));
fmt();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  pose(clock.getDelta());
  controls.update();
  renderer.render(scene, camera);
});
</script>
